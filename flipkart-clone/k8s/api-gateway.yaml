apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: flipkart
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: api-gateway-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: flipkart
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
        upstream user_service {
            server user-service:3001;
        }
        upstream product_service {
            server product-service:3002;
        }
        upstream cart_service {
            server cart-service:3003;
        }
        upstream payment_service {
            server payment-service:3004;
        }
        upstream order_service {
            server order-service:3005;
        }

        # Rate limiting for payment service (protects HPA from sudden spikes)
        limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/s;

        server {
            listen 80;

            location /health {
                return 200 '{"status":"healthy","service":"api-gateway"}';
                add_header Content-Type application/json;
            }

            location /api/users/ {
                proxy_pass http://user_service/api/users/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /api/products/ {
                proxy_pass http://product_service/api/products/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /api/cart/ {
                proxy_pass http://cart_service/api/cart/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /api/payments/ {
                limit_req zone=payment_limit burst=20 nodelay;
                proxy_pass http://payment_service/api/payments/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
            }

            location /api/orders/ {
                proxy_pass http://order_service/api/orders/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flipkart
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 80

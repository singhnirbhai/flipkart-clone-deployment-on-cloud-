#################################################################
# PROMETHEUS - Metrics Collection for Cluster Monitoring
#
# Kya monitor karta hai:
# 1. All microservices metrics (HTTP requests, CPU, memory)
# 2. Payment service custom metrics (active payments, success rate)
# 3. Kubernetes pod metrics (restarts, pod count)
# 4. HPA metrics (current/target replicas)
#################################################################

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Scrape all payment-service pods (this is what HPA watches)
      - job_name: 'payment-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flipkart
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: payment-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:3004
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
            replacement: ${1}

      # Scrape user-service pods
      - job_name: 'user-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flipkart
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: user-service
            action: keep

      # Scrape product-service pods
      - job_name: 'product-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flipkart
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: product-service
            action: keep

      # Scrape cart-service pods
      - job_name: 'cart-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flipkart
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: cart-service
            action: keep

      # Scrape order-service pods
      - job_name: 'order-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flipkart
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: order-service
            action: keep

      # Scrape Kubernetes metrics (kube-state-metrics)
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring:8080']

      # Scrape node exporter
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter.monitoring:9100']

  alert_rules.yml: |
    groups:
      - name: payment_service_alerts
        rules:
          - alert: HighCPUUsage
            expr: avg(rate(http_request_duration_seconds_count{job="payment-service"}[5m])) by (pod) > 50
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High request rate on payment service"

          - alert: PaymentServiceDown
            expr: up{job="payment-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Payment service is down"

          - alert: HighMemoryUsage
            expr: process_resident_memory_bytes{job="payment-service"} / 1024 / 1024 > 400
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Payment service memory usage high"

          - alert: PodRestartLoop
            expr: increase(kube_pod_container_status_restarts_total{namespace="flipkart"}[1h]) > 5
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is in a restart loop"

      - name: cluster_alerts
        rules:
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is not ready"

          - alert: PodPendingTooLong
            expr: kube_pod_status_phase{phase="Pending",namespace="flipkart"} > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} pending too long"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.retention.time=30d'
            - '--web.enable-lifecycle'
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

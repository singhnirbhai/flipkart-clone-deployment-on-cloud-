#################################################################
# GRAFANA - Dashboard for Cluster Monitoring
#
# Dashboards:
# 1. Flipkart Cluster Overview - pods, nodes, namespace stats
# 2. Microservices Dashboard - HTTP metrics per service
# 3. Payment Service Dashboard - HPA metrics, payment success rate
# 4. Kubernetes Overview - node health, pod status
#################################################################

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Flipkart'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-flipkart-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  flipkart-cluster.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "title": "Flipkart Cluster Overview",
      "uid": "flipkart-cluster",
      "panels": [
        {
          "title": "Payment Service - Active Payments",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "payment_active_processing{namespace=\"flipkart\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Payment Service - HTTP Requests/sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "rate(http_requests_total{job=\"payment-service\"}[5m])",
              "legendFormat": "{{method}} {{route}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Payment Service - CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=\"payment-service\"}[5m]) * 100",
              "legendFormat": "{{pod}} CPU%",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Payment Service - Memory Usage (MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"payment-service\"} / 1024 / 1024",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HPA - Payment Service Pod Count",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=\"payment-service-hpa\",namespace=\"flipkart\"}",
              "legendFormat": "Current",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 8 }
                ]
              }
            }
          }
        },
        {
          "title": "HPA - Target Replicas",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 16 },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"payment-service-hpa\",namespace=\"flipkart\"}",
              "legendFormat": "Desired",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Total HTTP Requests by Service",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Pod Status - Flipkart Namespace",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "targets": [
            {
              "expr": "kube_pod_status_phase{namespace=\"flipkart\"}",
              "legendFormat": "{{pod}} - {{phase}}",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ]
        }
      ],
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "5s"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/flipkart-cluster.json"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: flipkart-dashboard
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: flipkart-dashboard
          configMap:
            name: grafana-flipkart-dashboard
        - name: grafana-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
